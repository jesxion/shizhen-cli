[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shizhen"
dynamic = ["version"]
description = "拾帧命令行工具：识别短视频分享链接，提取视频或音频文件"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
]

[project.scripts]
shizhen = "shizhen.cli:run"

[tool.setuptools]
packages = ["shizhen"]

[tool.setuptools.dynamic]
version = {attr = "shizhen.__version__"}
